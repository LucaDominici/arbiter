# SonarCloud configuration — arbiter self-config (TypeScript L3)
# Replace PLACEHOLDER values with your SonarCloud org/project before first scan.
sonar.organization=PLACEHOLDER_ORG
sonar.projectKey=PLACEHOLDER_PROJECT_KEY
sonar.projectName=arbiter
sonar.qualitygate.wait=true
sonar.sources=src
sonar.tests=__tests__
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts,**/*.spec.ts,src/templates/**
