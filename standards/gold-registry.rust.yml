# Gold-Audit registry — Rust stack (#1426). Selected with `gold-audit --stack rust`.
#
# A JUSTIFIED SUBSET mirroring the Java/TypeScript registries' two families (config-presence +
# report-metric value op). The full Rust gold-kit is deferred; this ships the SAFE core. Every check
# here is SAFE: anchored, deterministic, report-grounded — no app-specific single-proxy grep and no
# absolute gold-sized count baked in (the bars live in standards/thresholds.yml, keyed by class).
#
# Two check families:
#   * config-presence (file_exists) — the tool is WIRED, not just aspirational.
#   * report-metric (type: value, format: json|xml) — reads a PRE-GENERATED tool report
#     deterministically and compares the extracted metric to a per-brownfield-class bar resolved via
#     threshold_ref. A check whose report file is ABSENT scores NA (the tool did not run / does not
#     apply) — never a false-N. No live spawn: the engine stays deterministic and engine.ts ⇆
#     gold-audit-lib.mjs parity holds.
#
# applies_if: has-rust gates the report checks behind the Rust overlay, so auditing a non-Rust repo
# with this registry yields NA (no false gaps). Enable via the profile:  overlays: [has-rust]
#
# Verdicts: Y verified-true · P partial · N verified-false · NA not-applicable · NV manual.
# Scoring excludes NA + NV (you are not graded on what code can't verify or on tools that did not run).
version: '1.0.0'
profile: rust

dimensions:
  - id: D-BUILD
    title: Crate + dependency hygiene
  - id: D-LINT
    title: Static lint (clippy)
  - id: D-FORMAT
    title: Formatting (rustfmt)
  - id: D-COVERAGE
    title: Test coverage (cargo-tarpaulin)

checks:
  # ── D-BUILD: a crate manifest is declared (Cargo.toml present). ────────────────────────────────
  - id: RS-BUILD-01
    dimension: D-BUILD
    title: Crate manifest present (Cargo.toml)
    type: file_exists
    args: { path: Cargo.toml }
    weight: 1
    risk: SAFE
    applies_if: has-rust

  # ── D-LINT: clippy is wired (config declared) AND warning count under the per-class ceiling. ───
  - id: RS-LINT-01
    dimension: D-LINT
    title: clippy config present (lint gate wired)
    type: file_exists
    args: { path: clippy.toml }
    weight: 1
    risk: SAFE
    applies_if: has-rust
  - id: RS-LINT-02
    dimension: D-LINT
    title: clippy warning count under the per-class ceiling (clippy-report.json)
    type: value
    args:
      path: clippy-report.json
      format: json
      select: 'warnings'
      op: lte
    threshold_ref: clippy.warnings
    weight: 2
    risk: SAFE
    applies_if: has-rust
    anchor: INV-25

  # ── D-FORMAT: rustfmt is wired (config declared). ─────────────────────────────────────────────
  - id: RS-FMT-01
    dimension: D-FORMAT
    title: rustfmt config present (formatting wired)
    type: file_exists
    args: { path: rustfmt.toml }
    weight: 1
    risk: SAFE
    applies_if: has-rust

  # ── D-COVERAGE: tarpaulin wired AND line coverage % meets the per-class floor. ─────────────────
  - id: RS-COV-01
    dimension: D-COVERAGE
    title: tarpaulin cobertura report present (coverage measured)
    type: file_exists
    args: { path: cobertura.xml }
    weight: 1
    risk: SAFE
    applies_if: has-rust
  - id: RS-COV-02
    dimension: D-COVERAGE
    title: Line coverage meets the per-class floor (tarpaulin cobertura line-rate, a 0..1 ratio)
    type: value
    args:
      path: cobertura.xml
      format: regex
      select: '<coverage[^>]*line-rate="([0-9.]+)"'
      op: gte
      # tarpaulin emits line-rate as a 0..1 RATIO (100% coverage → 1.0) and the engine extracts the
      # raw capture with NO ×100 scaling, so the bar must be in 0..1 units too: threshold_ref points at
      # rust.coverage.line_rate (gold 0.90), NOT the 0..100 percent family. The registry carries no
      # literal — the per-class floor lives in thresholds.yml (#1569).
    threshold_ref: rust.coverage.line_rate
    weight: 2
    risk: SAFE
    applies_if: has-rust
    anchor: INV-25
