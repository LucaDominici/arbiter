# CLI emitted surface — atomic vocabulary (#2706)
#
# Every root a generated artifact may cite. The incompatible cut deliberately
# replaces the former append-only alias ledger: retired spellings must not stay
# executable merely because an older artifact once named them.
commands:
  - command: init
  - command: configure
  - command: update
  - command: ship
  - command: status
  - command: explain
  - command: lifecycle
  - command: check
  - command: audit
  - command: finding
  - command: docs
  - command: graph
  - command: worktree
  - command: review
