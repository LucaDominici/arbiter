name: Task Brief
description: Implementation task for AI-assisted development
labels: ['task']
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What must be true when this task is done?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Files/contracts expected to change (read by the INV-137 readiness gate)
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >-
        Explicit, stable `AC-N:` ids — acceptance tests and the review FIT rubric cite
        these verbatim (INV-137). Gate/lint greenness is implied, never a criterion.
        Replace the placeholders: an issue that keeps them is not ready.
      value: |
        - [ ] AC-1: <observable behavior>
        - [ ] AC-2: <edge-case / failure-mode behavior>
    validations:
      required: true

  - type: textarea
    id: nongoals
    attributes:
      label: Non-goals
      description: What this task deliberately leaves out — the scope-creep guard the reviewer enforces.
      placeholder: '- No refactor of the adjacent X module'
    validations:
      required: true

  - type: input
    id: canon
    attributes:
      label: Applicable CANON-NN IDs
      description: 'Which canon rules gate this implementation? See docs/SYSTEM/CANON.md. Leave blank if none.'
      placeholder: 'e.g. CANON-05, CANON-11'

  - type: dropdown
    id: size
    attributes:
      label: Estimated size
      options:
        - 'XS (< 30 min)'
        - 'S (30 min — 2 hours)'
        - 'M (2 — 8 hours)'
        - 'L (1 — 3 days)'
    validations:
      required: true
