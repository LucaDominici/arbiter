name: Feature Request
description: Propose a new feature or improvement
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Context and motivation
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should change and how?
    validations:
      required: true

  - type: input
    id: canon
    attributes:
      label: Applicable CANON-NN IDs
      description: "Which canon rules gate this implementation? See docs/SYSTEM/CANON.md. Leave blank if none."
      placeholder: "e.g. CANON-01, CANON-04"

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
