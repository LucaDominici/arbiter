name: Nightly (T4)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  mutation-deep:
    name: Deep mutation testing
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm
      - name: Stryker mutation (full suite)
        run: npx stryker run


  dast-full:
    name: OWASP ZAP full scan

    if: false

    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: ZAP full scan
        uses: zaproxy/action-full-scan@d2a07475d467566c9a3e3c700f31f47724aa1060  # v0.10.0
        with:
          target: 'http://localhost:8080'
          fail_action: false
          artifact_name: zap-full-report

  dep-cve-refresh:
    name: Dependency CVE refresh
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-node-pnpm
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
      - name: osv-scanner
        uses: google/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: '--lockfile=package-lock.json'


  fuzz:
    name: Fuzz testing
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-node-pnpm
      - name: fast-check fuzz (property-based)
        run: npm run test:fuzz


  soak-e2e:
    name: Soak / E2E full suite
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-node-pnpm
      - name: Bake E2E
        run: npm run test:e2e:bake
      - name: Native E2E
        env:
          VITEST_NATIVE: "1"
        run: npm run test:e2e:native



  bake-e2e-native:
    name: Native fixture smoke (${{ matrix.stack }})
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: ts
            fixture: ts-library
          - stack: python
            fixture: python-library
          - stack: go
            fixture: go-library
          - stack: java
            fixture: java-library-gradle
          - stack: rust
            fixture: rust-library
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-node-pnpm

      - uses: actions/setup-python@a26af69b4fde46a5e1776bf3f1b1e6dd8f0dd5ca # v5
        if: matrix.stack == 'python'
        with:
          python-version: '3.12'

      - uses: actions/setup-go@40f1582dade4d2f1c86a3da5e27c02b98fee3ec0 # v5
        if: matrix.stack == 'go'
        with:
          go-version-file: __tests__/fixtures/real-projects/go-library/go.mod

      - uses: actions/setup-java@c1e32368a7ca79e19b34aa7e28d3de3a8b47c8ea # v4
        if: matrix.stack == 'java'
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        if: matrix.stack == 'java'

      - uses: dtolnay/rust-toolchain@29eef335eb45f53c3dc45d8f50abf17af8e2b0bd # branch:stable @ 2026-05-24
        if: matrix.stack == 'rust'
        with:
          toolchain: stable

      - name: Native smoke (${{ matrix.stack }})
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: VITEST_NATIVE=1 npx vitest run --config vitest.integration.config.ts __tests__/integration/e2e/native/ -t "$FIXTURE"



  gitleaks-history:
    name: Secret scan (full history)
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Gitleaks full history scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --log-opts="--all --full-history"


  gate-full-nightly:
    name: Full Gate nightly (L2+, INV-59)
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Install gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.3/actionlint_1.7.3_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build
        run: npm run build && node scripts/build-kit.mjs
      - name: Run full L2 gate (== pre-push, nightly)
        run: node scripts/check-all.mjs --level L2 --json gate-result-nightly.json
      - name: Upload nightly gate-result artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607f72a  # v4.6.2
        with:
          name: gate-result-nightly
          path: gate-result-nightly.json
          retention-days: 30


  evidence-collect:
    name: Upload nightly evidence artifacts
    needs:
      - mutation-deep
      - dep-cve-refresh
      - fuzz
      - soak-e2e
      - gitleaks-history

      - gate-full-nightly


      - bake-e2e-native

    if: always()
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Collect evidence summary
        run: |
          mkdir -p nightly-evidence
          echo "Nightly run: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > nightly-evidence/summary.txt
          echo "Ref: ${{ github.sha }}" >> nightly-evidence/summary.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-evidence-${{ github.run_id }}
          path: nightly-evidence/
          retention-days: 90

  nightly-required:
    name: Nightly gate
    needs:
      - mutation-deep
      - dep-cve-refresh
      - fuzz
      - soak-e2e
      - gitleaks-history


      - bake-e2e-native

    if: always()
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Assert no hard failures
        run: |
          RESULTS=(
            "${{ needs.mutation-deep.result }}"
            "${{ needs.dep-cve-refresh.result }}"
            "${{ needs.fuzz.result }}"
            "${{ needs.soak-e2e.result }}"
            "${{ needs.gitleaks-history.result }}"

            "${{ needs.bake-e2e-native.result }}"

          )
          FAILED=0
          for r in "${RESULTS[@]}"; do
            if [ "$r" = "failure" ]; then
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "::error::One or more nightly hard-failure jobs failed."
            exit 1
          fi
          echo "Nightly gate passed."

      - name: File issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          EXISTING=$(gh issue list \
            --label nightly-regression \
            --state open \
            --limit 1 \
            --json number \
            --repo "$GH_REPO" \
            --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "[nightly] regression detected (${{ github.run_id }})" \
              --body "Nightly workflow failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --label nightly-regression \
              --repo "$GH_REPO"
          fi
