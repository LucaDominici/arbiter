name: Nightly (T4)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  mutation-deep:
    name: Deep mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Stryker mutation (full suite)
        run: npx stryker run
        continue-on-error: true

  dep-cve-refresh:
    name: Dependency CVE refresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
      - name: osv-scanner
        uses: google/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: '--lockfile=package-lock.json'
        continue-on-error: true

  fuzz:
    name: Fuzz testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: fast-check fuzz (property-based)
        run: npm run test:fuzz || npm run test:property || true

  gitleaks-history:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks full history scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --log-opts="--all --full-history"
        continue-on-error: true

  evidence-collect:
    name: Upload nightly evidence artifacts
    needs:
      - mutation-deep
      - dep-cve-refresh
      - fuzz
      - gitleaks-history
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Collect evidence summary
        run: |
          mkdir -p nightly-evidence
          echo "Nightly run: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > nightly-evidence/summary.txt
          echo "Ref: ${{ github.sha }}" >> nightly-evidence/summary.txt
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: nightly-evidence-${{ github.run_id }}
          path: nightly-evidence/
          retention-days: 90

  nightly-required:
    name: Nightly gate
    needs:
      - mutation-deep
      - dep-cve-refresh
      - fuzz
      - gitleaks-history
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert no hard failures
        env:
          DEP_CVE_RESULT: ${{ needs.dep-cve-refresh.result }}
        run: |
          FAILED=0
          if [ "$DEP_CVE_RESULT" = "failure" ]; then
            FAILED=1
          fi
          if [ "$FAILED" = "1" ]; then
            echo "::error::One or more nightly hard-failure jobs failed."
            exit 1
          fi
          echo "Nightly gate passed."

      - name: File issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          EXISTING=$(gh issue list \
            --label nightly-regression \
            --state open \
            --limit 1 \
            --json number \
            --repo "$GH_REPO" \
            --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "[nightly] regression detected ($RUN_ID)" \
              --body "Nightly workflow failed. Run: $SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID" \
              --label nightly-regression \
              --repo "$GH_REPO"
          fi
