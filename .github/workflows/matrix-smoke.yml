name: Matrix Smoke

on:
  push:
    branches: ['task/**', 'main']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC nightly
  workflow_dispatch:
    inputs:
      proven_only:
        description: 'Limit to proven-only combos (no beta tools)'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: matrix-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover combos
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      subset_matrix: ${{ steps.build_subset.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps

      - id: build
        name: Build nightly combo matrix
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          COMBOS=$(node scripts/matrix-smoke.mjs --list-combos)
          MATRIX=$(echo "$COMBOS" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const a=JSON.parse(d);console.log(JSON.stringify({include:a}))")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - id: build_subset
        name: Build PR fast-lane combo matrix (10 proven-only)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          COMBOS=$(node scripts/matrix-smoke-subset.mjs)
          MATRIX=$(echo "$COMBOS" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const a=JSON.parse(d);console.log(JSON.stringify({include:a}))")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  smoke-nightly:
    name: smoke (${{ matrix.language }}, ${{ matrix.archetype }}, ${{ matrix.level }})
    needs: discover
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.discover.outputs.matrix != ''
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run build

      - if: matrix.language == 'java'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Init project (arbiter smoke)
        env:
          LANGUAGE: ${{ matrix.language }}
          ARCHETYPE: ${{ matrix.archetype }}
          LEVEL: ${{ matrix.level }}
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-project"
          node dist/cli.js init --yes \
            --language="$LANGUAGE" \
            --archetype="$ARCHETYPE" \
            --level="$LEVEL" \
            --dir="$RUNNER_TEMP/smoke-project"

      - name: Verify generated config
        run: node dist/cli.js verify --dir="$RUNNER_TEMP/smoke-project"

  smoke-pr:
    name: smoke-fast (${{ matrix.language }}, ${{ matrix.archetype }}, ${{ matrix.level }})
    needs: discover
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && needs.discover.outputs.subset_matrix != ''
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.subset_matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run build

      - if: matrix.language == 'java'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Init project (arbiter smoke)
        env:
          LANGUAGE: ${{ matrix.language }}
          ARCHETYPE: ${{ matrix.archetype }}
          LEVEL: ${{ matrix.level }}
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-project"
          node dist/cli.js init --yes \
            --language="$LANGUAGE" \
            --archetype="$ARCHETYPE" \
            --level="$LEVEL" \
            --dir="$RUNNER_TEMP/smoke-project"

      - name: Verify generated config
        run: node dist/cli.js verify --dir="$RUNNER_TEMP/smoke-project"

  aggregate:
    name: Aggregate nightly results
    needs: smoke-nightly
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    timeout-minutes: 5
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Require at least 60 successful matrix jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          MIN_PASS: '60'
          JOB_NAME_PREFIX: 'smoke ('
        run: node scripts/aggregate-matrix-result.mjs
