name: Real-Project Matrix

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: real-project-matrix
  cancel-in-progress: false

jobs:
  discover:
    name: Discover fixtures
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - id: build
        name: Build matrix from fixture manifests
        run: node scripts/build-matrix.mjs >> $GITHUB_OUTPUT

  run:
    name: run (${{ matrix.fixture }}, ${{ matrix.level }})
    needs: discover
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    # v1: isolate runner infra failures — aggregate job enforces >=10 pass floor
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - run: npm run build

      # ─── Per-language toolchain setup ──────────────────────────────────────

      - if: matrix.language == 'java'
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - if: matrix.language == 'java'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.8"

      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - if: matrix.language == 'go'
        name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v1.57.2
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - if: matrix.language == 'go' && matrix.level == 'L2'
        name: Install Go L2 analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: matrix.language == 'python' && matrix.level == 'L2'
        name: Install Python L2 analysis tools
        run: pip install pip-audit pytest-cov

      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - if: matrix.language == 'rust' && matrix.level == 'L2'
        name: Install Rust L2 analysis tools
        run: |
          cargo install cargo-audit --locked
          VERSION=0.31.2
          curl -sSfL "https://github.com/xd009642/tarpaulin/releases/download/${VERSION}/cargo-tarpaulin-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C ~/.cargo/bin

      - if: matrix.level == 'L2'
        name: Install gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      # ─── Stage fixture ──────────────────────────────────────────────────────

      - name: Stage fixture
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: cp -r "__tests__/fixtures/real-projects/$FIXTURE" "$RUNNER_TEMP/project"

      - if: matrix.language == 'java'
        name: Make gradlew executable
        run: chmod +x "$RUNNER_TEMP/project/gradlew"

      # ─── Install fixture deps (language-specific) ───────────────────────────

      - if: matrix.language == 'typescript'
        name: Install TypeScript fixture deps
        working-directory: ${{ runner.temp }}/project
        run: npm install --legacy-peer-deps

      - if: matrix.language == 'python'
        name: Install Python fixture deps
        working-directory: ${{ runner.temp }}/project
        run: pip install -e ".[test]"

      - if: matrix.language == 'go'
        name: Download Go modules
        working-directory: ${{ runner.temp }}/project
        run: go mod download

      # ─── arbiter pipeline ───────────────────────────────────────────────────

      - name: arbiter init
        env:
          LEVEL: ${{ matrix.level }}
        working-directory: ${{ runner.temp }}/project
        run: node "$GITHUB_WORKSPACE/dist/cli.js" init --yes --no-verify --level="$LEVEL"

      - name: arbiter verify
        working-directory: ${{ runner.temp }}/project
        run: node "$GITHUB_WORKSPACE/dist/cli.js" verify

      - name: Run generated gate
        env:
          LEVEL: ${{ matrix.level }}
        working-directory: ${{ runner.temp }}/project
        run: node scripts/check-all.mjs "$LEVEL"

  aggregate:
    name: Aggregate results
    needs: run
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    timeout-minutes: 5
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - name: Require at least 10 successful matrix jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          MIN_PASS: "10"
        run: node scripts/aggregate-matrix-result.mjs
