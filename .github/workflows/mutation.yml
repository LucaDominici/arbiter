name: Mutation Testing (#595)

# Runs Stryker nightly on critical source paths.
# Uses npx to fetch the modern @stryker-mutator/core package
# (the bare `stryker` package on npm is the legacy 0.x line with a
# broken `rx` dependency — see #822).
# Threshold: mutation score < 60% on targeted paths → gate fails.
# On failure: opens a GH issue with the paths that dropped below threshold.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  mutation:
    name: Stryker Mutation Score
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Run Stryker
        id: stryker
        run: npx -y -p @stryker-mutator/core@^9 -- stryker run --concurrency 2
        continue-on-error: true

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ github.run_id }}
          path: reports/mutation/
          retention-days: 30

      - name: Open issue on mutation failure
        if: steps.stryker.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DATE="$(date +%Y-%m-%d)"
          gh issue create \
            --title "Stryker mutation run failed (nightly $DATE)" \
            --body "The Stryker nightly run failed on $DATE. The failure may be: (a) mutation score below the 60% threshold on a critical path, or (b) a crash (config error, dependency resolution, runner OOM). Inspect the artifact attached to the workflow run to distinguish. Workflow run: $RUN_URL" \
            --label "test,priority/P2"

      - name: Fail job if Stryker failed
        if: steps.stryker.outcome == 'failure'
        run: exit 1
