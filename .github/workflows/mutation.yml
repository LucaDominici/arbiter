name: Mutation Testing (#595)

# Runs Stryker nightly on critical source paths.
# Uses npx — no @stryker-mutator/* deps in package.json.
# Threshold: mutation score < 60% on targeted paths → gate fails.
# On failure: opens a GH issue with the paths that dropped below threshold.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  mutation:
    name: Stryker Mutation Score
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Run Stryker
        id: stryker
        run: npx stryker run --concurrency 2
        continue-on-error: true

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ github.run_id }}
          path: reports/mutation/
          retention-days: 30

      - name: Open issue on mutation score regression
        if: steps.stryker.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Mutation score below threshold (nightly $(date +%Y-%m-%d))" \
            --body "Stryker run failed on $(date +%Y-%m-%d). Mutation score dropped below 60% threshold on one or more critical paths. See workflow run: $RUN_URL" \
            --label "test,priority/P2"

      - name: Fail job if Stryker failed
        if: steps.stryker.outcome == 'failure'
        run: exit 1
