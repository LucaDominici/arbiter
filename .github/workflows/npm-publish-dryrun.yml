name: npm publish dry-run

# Runs on every PR targeting main.
# Verifies the package can be published without errors.
# Fails if npm publish --dry-run exits non-zero.
# Also enforces the package size budget (A7): hard cap 5 MB unpacked.

on:
  pull_request:
    branches: [main]

jobs:
  dry-run:
    name: npm publish dry-run
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build dist
        run: npm run build

      - name: npm publish dry-run
        run: npm publish --dry-run --access public

      - name: Package size budget check
        run: node scripts/check-pack-size.mjs --strict
