name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one release can run at a time; cancel stale queued runs but let the
# in-progress release complete.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version and Publish
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      # If changesets are present, this step creates a "Version Packages" PR.
      # When that PR is merged, changesets version bumps package.json + CHANGELOG.md.
      # On subsequent runs (with no pending changesets) it publishes to npm.
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run changeset:publish
          version: npm run changeset:version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
