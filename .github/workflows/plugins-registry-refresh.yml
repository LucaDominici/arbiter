name: Plugin registry refresh

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC nightly
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh plugin listing
        run: node scripts/refresh-plugin-listing.mjs

      - name: Open PR if listing changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: refresh plugin registry listing (nightly)'
          title: 'chore: refresh plugin registry listing'
          body: 'Auto-generated by the plugins-registry-refresh workflow. Updates website/plugins/index.md from npm registry (keywords:arbiter-plugin).'
          branch: chore/plugin-registry-refresh
          delete-branch: true
          labels: 'automated,documentation'
          add-paths: website/plugins/index.md
