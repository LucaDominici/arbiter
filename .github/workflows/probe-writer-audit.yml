name: Probe↔Writer Alignment Audit

on:
  schedule:
    # Sunday 04:00 UTC — same window as the weekly T5 sweeps.
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: probe-writer-audit
  cancel-in-progress: false

jobs:
  probe-writer-audit:
    name: Full-matrix probe↔writer alignment audit (#1707)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Run probe↔writer alignment audit
        id: run_audit
        run: |
          set -o pipefail
          node scripts/probe-writer-audit.mjs 2>&1 | tee /tmp/probe-writer-audit.log

      - name: File issue on audit failure
        if: failure() && steps.run_audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          REPORT_HEAD=$(sed -n '1,80p' /tmp/probe-writer-audit.log 2>/dev/null || echo "(log unavailable)")
          # FAIL-OPEN-INTENT: label may already exist; creation failure is harmless
          gh label create probe-writer-drift --color B60205 --description "probe≠writer alignment mismatch (safety net #1707)" 2>/dev/null || true
          EXISTING=$(gh issue list \
            --label probe-writer-drift \
            --state open \
            --limit 1 \
            --json number \
            --repo "$GH_REPO" \
            --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            printf '%s\n' \
              "The weekly probe↔writer alignment audit found a spurious N on a fresh-generated project — a conformance probe reads a field/path/shape the generator never emits (probe≠writer class)." \
              "" \
              "Run: ${RUN_URL}" \
              "" \
              '```text' \
              "${REPORT_HEAD}" \
              '```' \
              "" \
              "Reproduce with: \`node scripts/probe-writer-audit.mjs\` (after \`npm run build\`)" \
              "" \
              "Fix the probe or the generator (CANON-22: align the writer with the probe), and add the cell to the per-PR guard (__tests__/conformance/probe-writer-alignment.test.ts, #1704)." \
              > /tmp/issue-body.txt
            gh issue create \
              --title "[probe-writer-audit] full-matrix alignment mismatch (run ${RUN_ID})" \
              --body-file /tmp/issue-body.txt \
              --label probe-writer-drift \
              --repo "$GH_REPO"
          fi