name: Release (T3)

# Arbiter self-config dogfood: TS lib at L2 governance (CANON-01, INV-92, #885).
# Generated from: src/templates/github/workflows/05-release.yml.ejs
# Stack: typescript / lib / L2

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-superset:
    name: Build superset
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: ./.github/actions/setup-node-pnpm
      - run: npm run build
      - name: Pack-size guard (early signal; hard cap blocks, #1491/B6)
        # --ci: surfaces the 4.75–5.0 MB warn band loudly without failing the
        # build, but a breach of the 5 MB hard cap (#511) fails here at the START
        # of the release run instead of only at the terminal prepublishOnly gate.
        run: node scripts/check-pack-size.mjs --ci
      - name: Package artifact
        run: zip -r release-artifact.zip dist/
      - name: Compute artifact hash
        id: hash
        run: |
          sha256sum release-artifact.zip > sha256sums.txt
          echo "hashes=$(base64 -w0 sha256sums.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-artifact
          path: |
            release-artifact.zip
            sha256sums.txt
          retention-days: 30

  trivy-fs-scan:
    name: Trivy filesystem scan (CRITICAL block, INV-92)
    needs: [build-superset]
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Scan filesystem for CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL
          trivyignores: .trivyignore

  mutation-blocking:
    name: Mutation tests (blocking)
    needs: [build-superset]
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    continue-on-error: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: ./.github/actions/setup-node-pnpm
      - name: Stryker mutation
        run: npx stryker run

  secret-scan-history:
    name: Full-history secret scan
    needs: [build-superset]
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      # #1311: self-hosted persistent workspaces can keep a stale
      # .git/refs/**/*.lock from an interrupted run, which makes the
      # deep checkout below fail with "cannot lock ref". No-op on
      # ephemeral runners. Keep as a separate hunk: Wave-2 #1319 edits
      # the checkout step's name:/SHA pin below, not this guard.
      - name: Clean stale git ref locks (self-hosted)
        # FAIL-OPEN-INTENT: best-effort stale ref-lock sweep; a real failure still surfaces at checkout
        run: find "$GITHUB_WORKSPACE/.git/refs" -name '*.lock' -delete 2>/dev/null || true
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@74aaaea42853bce3a8f28c73c4b7cec8be22ecfd  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: '--log-opts --full-history'

  sbom:
    name: Generate SBOM (CycloneDX)
    needs: [build-superset]
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: ./.github/actions/setup-node-pnpm
      - name: Generate CycloneDX SBOM
        run: npm sbom --omit dev --package-lock-only --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.*
          retention-days: 90

  cosign-sign:
    name: Sign artifact (cosign keyless, INV-79)
    needs: [build-superset, mutation-blocking, secret-scan-history, trivy-fs-scan]
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifact
      - uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a  # v3.8.1
      - name: Sign artifact (keyless OIDC)
        run: cosign sign-blob --yes release-artifact.zip --bundle release-artifact.zip.bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cosign-bundle
          path: release-artifact.zip.bundle
          retention-days: 90

  sbom-attest:
    name: Attest SBOM (cosign attest, CycloneDX predicate, INV-92)
    needs: [sbom, cosign-sign]
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifact
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom
      - uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a  # v3.8.1
      - name: Attest SBOM (CycloneDX predicate)
        env:
          SBOM_FILE: sbom.cdx.json
          ARTIFACT: release-artifact.zip
        run: |
          cosign attest --yes \
            --predicate "$SBOM_FILE" \
            --type cyclonedx \
            "$ARTIFACT"

  slsa-provenance:
    name: SLSA provenance (L2 signed, INV-78)
    needs: [build-superset]
    if: github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a  # v2.1.0
    with:
      base64-subjects: ${{ needs.build-superset.outputs.hashes }}
    secrets: inherit

  attest-build-provenance:
    name: Attest build provenance
    needs: [build-superset]
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifact
      - uses: actions/attest-build-provenance@520aba26e2f010aaab88f4a9c58cdbb3f3965fc2  # v2
        with:
          subject-path: release-artifact.zip

  publish-package:
    name: Publish package (lib)
    needs: [cosign-sign, attest-build-provenance, slsa-provenance, sbom-attest]
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write  # required by `npm publish --provenance` (OIDC)
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifact
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-required:
    name: Release gate
    needs:
      - mutation-blocking
      - secret-scan-history
      - trivy-fs-scan
      - sbom
      - cosign-sign
      - sbom-attest
      - slsa-provenance
      - attest-build-provenance
      - publish-package
    if: always()
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Release gate summary
        run: |
          echo "Release checks completed."
          echo "Supply-chain: Trivy CRITICAL block + cosign sign + SBOM attest verified."
