name: Release (T3)

# Arbiter self-config dogfood: TS lib at L2 governance (CANON-01, INV-92, #885).
# Generated from: src/templates/github/workflows/05-release.yml.ejs
# Stack: typescript / lib / L2

# E3: release machinery is PROD-only. The full sign / SBOM / SLSA / attest /
# trivy-strict chain runs ONLY on a release tag push — never on a PR. (A prior
# PR trigger leaked the entire heavy release build onto every PR to
# main, since build-superset/mutation/secret-history/sbom carried no event guard.)
# A PR-time guard (github.event_name) still defends the signing jobs as backstop.
on:
  push:
    tags:
      - 'v*'
      - '!v0.0.0-verify-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-superset:
    name: Build superset
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: npm run build
      - name: Pack-size guard (early signal; hard cap blocks, #1491/B6)
        # --ci: surfaces the 4.75–5.0 MB warn band loudly without failing the
        # build, but a breach of the 5 MB hard cap (#511) fails here at the START
        # of the release run instead of only at the terminal prepublishOnly gate.
        run: node scripts/check-pack-size.mjs --ci
      - name: Tarball-contents guard (no internal/backup leak, #1491)
        # Fails the release build if the published tarball would ship a
        # maintainer-internal doc (docs/internal/**) or a working-tree
        # *.arbiter-backup artifact — caught here at the START of the run,
        # not only at the terminal prepublishOnly gate.
        run: node scripts/check-tarball-contents.mjs
      - name: Package artifact (#2138 — pack ONCE, this exact tarball is signed and published)
        # `npm pack` produces the same bytes `npm publish` would upload. Everything
        # downstream (hash → SLSA subject → cosign → SBOM attest → publish) carries
        # THIS file, so the attestation covers what a consumer installs.
        run: |
          TARBALL=$(npm pack --silent --pack-destination .)
          mv "$TARBALL" release-artifact.tgz
      - name: Packaged export surface (#2139 — test the artifact about to be signed)
        # Installs THIS tarball into a clean directory and imports every subpath
        # package.json#exports declares. Runs before signing, so a package whose
        # declared API did not survive the build never reaches npm.
        env:
          ARBITER_PACKED_TARBALL: ${{ github.workspace }}/release-artifact.tgz
          VITEST_L2: '1'
        run: npx vitest run --config vitest.integration.config.ts __tests__/integration/e2e/functional/packaged-artifact.test.ts -t "signed bytes and declared surface"
      - name: Compute artifact hash
        id: hash
        run: |
          sha256sum release-artifact.tgz > sha256sums.txt
          echo "hashes=$(base64 -w0 sha256sums.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-artifact
          path: |
            release-artifact.tgz
            sha256sums.txt
          retention-days: 30

  trivy-fs-scan:
    name: Trivy filesystem scan (CRITICAL block, INV-92)
    needs: [build-superset]
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Scan filesystem for CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL
          trivyignores: .trivyignore

  mutation-blocking:
    name: Mutation tests (blocking)
    needs: [build-superset]
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Stryker mutation
        # errexit + pipefail (GitHub bash default) make a below-threshold mutation score fail the
        # step; the tee feeds the fail-on-empty guard below (#1505).
        run: npx stryker run 2>&1 | tee mutation-fallback.log
      # Fail-on-empty (#1505): a vacuous mutation run (zero mutants generated) must NOT pass the
      # release gate. Fail CLOSED — the gate passes only when Stryker reports it tested mutants;
      # an empty run (no source files matched, or a broken config) fails loudly, not silently.
      - name: Fail when the mutation run produced no mutants (#1505)
        run: |
          if [ ! -s mutation-fallback.log ]; then
            echo "::error::No mutation output captured — failing closed (an empty run is not a pass)."
            exit 1
          fi
          if ! grep -Eqi 'tests per mutant|mutation score|[1-9][0-9]* mutants' mutation-fallback.log; then
            echo "::error::Mutation run generated zero mutants — an empty run is not a pass (#1505)."
            exit 1
          fi
          echo "Mutation run produced mutants — fail-on-empty check passed."

  secret-scan-history:
    name: Full-history secret scan
    needs: [build-superset]
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      # See _nightly.yml: gitleaks-action downloads to a hardcoded /tmp/gitleaks.tmp and a
      # leftover on a self-hosted runner fails the install for good (#2100).
      - name: Clear stale gitleaks download temp
        run: rm -f /tmp/gitleaks.tmp
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: '--log-opts --full-history'

  sbom:
    name: Generate SBOM (CycloneDX)
    needs: [build-superset]
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Generate CycloneDX SBOM
        run: npm sbom --omit dev --package-lock-only --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.*
          retention-days: 90

  cosign-sign:
    name: Sign artifact (cosign keyless, INV-79)
    needs: [build-superset, mutation-blocking, secret-scan-history, trivy-fs-scan]
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifact
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign artifact (keyless OIDC)
        run: cosign sign-blob --yes release-artifact.tgz --bundle release-artifact.tgz.bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cosign-bundle
          path: release-artifact.tgz.bundle
          retention-days: 90

  sbom-attest:
    name: Attest SBOM (cosign attest, CycloneDX predicate, INV-92)
    needs: [sbom, cosign-sign]
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifact
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Attest SBOM (CycloneDX predicate)
        env:
          SBOM_FILE: sbom.cdx.json
          ARTIFACT: release-artifact.tgz
        run: |
          cosign attest --yes \
            --predicate "$SBOM_FILE" \
            --type cyclonedx \
            "$ARTIFACT"

  slsa-provenance:
    name: SLSA provenance (L2 signed, INV-78)
    needs: [build-superset]
    if: github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a  # v2.1.0
    with:
      base64-subjects: ${{ needs.build-superset.outputs.hashes }}
    secrets: inherit

  attest-build-provenance:
    name: Attest build provenance
    needs: [build-superset]
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifact
      - uses: actions/attest-build-provenance@520aba26e2f010aaab88f4a9c58cdbb3f3965fc2  # v2
        with:
          subject-path: release-artifact.tgz

  publish-package:
    name: Publish package (lib)
    needs: [cosign-sign, attest-build-provenance, slsa-provenance, sbom-attest]
    # #2138: publishing is reachable ONLY from a release tag. `github.event_name
    # != 'pull_request'` was not a guard — a manual dispatch on an arbitrary
    # branch walked straight into the publish step.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write  # required by `npm publish --provenance` (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifact
      - name: Verify the downloaded artifact is the one that was signed (#2138)
        # Fail closed if the bytes differ from the ones hashed in build-superset,
        # signed by cosign and carried as the SLSA subject.
        run: sha256sum -c sha256sums.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Publish to npm (with provenance)
        # Publishes the SIGNED tarball itself. Packing here instead would rerun
        # `prepack` and upload a rebuilt artifact the attestations do not cover.
        run: npm publish --provenance --access public release-artifact.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  doc-freshness-gate:
    name: Per-doc freshness gate (T4, gold-doc-tranches-t3-t5.md §2.3 — release-tag blocking)
    needs: [build-superset]
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Per-doc freshness audit — no stale gold doc ships in a tagged release
        run: node scripts/check-doc-freshness.mjs

  release-required:
    name: Release gate
    needs:
      - mutation-blocking
      - secret-scan-history
      - trivy-fs-scan
      - sbom
      - cosign-sign
      - sbom-attest
      - slsa-provenance
      - attest-build-provenance
      - publish-package
      - doc-freshness-gate
    if: always()
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    steps:
      - name: Release gate summary
        run: |
          echo "Release checks completed."
          echo "Supply-chain: Trivy CRITICAL block + cosign sign + SBOM attest verified."
