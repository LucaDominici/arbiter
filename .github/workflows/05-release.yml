name: Release (T3)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-superset:
    name: Build superset
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package artifact
        run: zip -r release-artifact.zip dist/

      - name: Compute artifact hash
        id: hash
        run: |
          sha256sum release-artifact.zip > sha256sums.txt
          echo "hashes=$(base64 -w0 sha256sums.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifact
          path: |
            release-artifact.zip
            sha256sums.txt
          retention-days: 30

  mutation-blocking:
    name: Mutation tests (blocking)
    needs: [build-superset]
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Stryker mutation
        run: npx stryker run

  secret-scan-history:
    name: Full-history secret scan
    needs: [build-superset]
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: '--log-opts --full-history'

  sbom:
    name: Generate SBOM
    needs: [build-superset]
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate CycloneDX SBOM
        run: npm sbom --omit dev --package-lock-only --sbom-format cyclonedx > sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.*
          retention-days: 90

  cosign-sign:
    name: Sign artifact (cosign keyless)
    needs: [build-superset, mutation-blocking, secret-scan-history]
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifact
      - uses: sigstore/cosign-installer@v3
      - name: Sign artifact (keyless OIDC)
        run: cosign sign-blob --yes release-artifact.zip --bundle release-artifact.zip.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: cosign-bundle
          path: release-artifact.zip.bundle
          retention-days: 90

  slsa-provenance:
    name: SLSA provenance (L2 signed)
    needs: [build-superset]
    if: github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.build-superset.outputs.hashes }}
    secrets: inherit

  attest-build-provenance:
    name: Attest build provenance
    needs: [build-superset]
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifact
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-artifact.zip

  publish-package:
    name: Publish package (lib)
    needs: [cosign-sign, attest-build-provenance, slsa-provenance]
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifact

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-required:
    name: Release gate
    needs:
      - mutation-blocking
      - secret-scan-history
      - sbom
      - cosign-sign
      - slsa-provenance
      - attest-build-provenance

      - publish-package

    if: always()
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - name: Release gate summary
        run: |
          echo "Release checks completed."
          echo "Signing, provenance, and mutation verified."
