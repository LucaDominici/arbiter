name: Docs A11y (#591)

# Runs axe-core on the built docs site to enforce WCAG 2.1 AA.
# Uses ubuntu-latest (github-hosted) — not self-hosted — so a real browser
# environment is available for axe.

on:
  push:
    branches: [main, 'task/**']
    paths:
      - 'docs/**'
      - '.github/workflows/docs-a11y.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-a11y.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a11y-audit:
    name: axe-core WCAG 2.1 AA
    # Set BROWSER_RUNNER_LABEL to a github-hosted runner (ubuntu-latest recommended).
    # Self-hosted runners lack a browser environment required by axe-core.
    runs-on: ${{ vars.BROWSER_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build docs site
        run: npm run docs:build

      - name: Serve docs site
        run: |
          npm run docs:serve &
          npx wait-on http://localhost:4173 --timeout 30000

      - name: Run axe-core on home page
        run: npx @axe-core/cli http://localhost:4173/ --exit

      - name: Run axe-core on quickstart page
        run: npx @axe-core/cli http://localhost:4173/quickstart --exit
