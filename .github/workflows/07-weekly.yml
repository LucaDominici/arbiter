name: Weekly (T5)

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    name: Weekly jobs
    uses: ./.github/workflows/_weekly.yml
    permissions:
      contents: read
      issues: write
    secrets: inherit
