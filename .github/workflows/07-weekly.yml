name: Weekly (T5)

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  dep-freshness:
    name: Dependency freshness report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check outdated packages
        run: npm outdated || true

  action-version-audit:
    name: Stale action pin audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Find SHA-pinned actions older than 180 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WORKFLOWS=$(find .github/workflows -name '*.yml' | head -20)
          STALE=0
          CUTOFF=$(date -d '180 days ago' +%s 2>/dev/null || date -v-180d +%s)
          for wf in $WORKFLOWS; do
            REFS=$(grep -oP 'uses: \S+@[a-f0-9]{40}' "$wf" | sed 's/uses: //' || true)
            for ref in $REFS; do
              ACTION=$(echo "$ref" | cut -d@ -f1)
              SHA=$(echo "$ref" | cut -d@ -f2)
              PUSHED=$(gh api "repos/$ACTION/git/commits/$SHA" --jq '.committer.date' 2>/dev/null || echo "")
              if [ -n "$PUSHED" ]; then
                PUSHED_EPOCH=$(date -d "$PUSHED" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$PUSHED" +%s)
                if [ "$PUSHED_EPOCH" -lt "$CUTOFF" ]; then
                  echo "::warning::Stale pin in $wf: $ref (pushed $PUSHED)"
                  STALE=$((STALE + 1))
                fi
              fi
            done
          done
          echo "Stale pins found: $STALE"

  cross-os-matrix:
    name: Cross-OS / cross-arch matrix (CLI)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build and smoke test CLI
        run: |
          npm run build
          node dist/cli.js --version || true

  weekly-required:
    name: Weekly gate
    needs:
      - dep-freshness
      - action-version-audit
      - cross-os-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Weekly gate summary
        run: |
          echo "Weekly checks completed."
          echo "All jobs ran (some informational, failures create issues)."

      - name: File issue on hard failures
        if: needs.dep-freshness.result == 'failure' || needs.action-version-audit.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          EXISTING=$(gh issue list \
            --label weekly-regression \
            --state open \
            --limit 1 \
            --json number \
            --repo "$GH_REPO" \
            --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "[weekly] regression detected ($RUN_ID)" \
              --body "Weekly workflow failed. Run: $SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID" \
              --label weekly-regression \
              --repo "$GH_REPO"
          fi
