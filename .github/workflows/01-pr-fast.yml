name: PR Fast (T1)

permissions:
  contents: read

on:
  push:
    branches: [main, 'task/**']
  pull_request:
    branches: [main]

# Cancel in-progress PR fast runs on the same branch to free capacity.
# Main runs always complete so post-merge status isn't truncated (#357).
concurrency:
  group: pr-fast-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  solo-dev-gate:
    name: Solo-Dev Gate (INV-59)
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - run: echo "solo-dev mode — local L2 gate guards merge via INV-59 parity check"
