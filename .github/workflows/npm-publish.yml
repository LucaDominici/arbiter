name: Publish to npm

# Triggered on v* tags. Tag shape drives the dist-tag (#660 / R1.Q1):
#   vX.Y.Z              → --tag latest  (stable channel)
#   vX.Y.Z-rc.N         → --tag beta    (release-candidate channel)
#   vX.Y.Z-canary.SHA   → --tag canary  (every-merge channel; usually
#                                        produced by canary-publish.yml,
#                                        but accepted here for manual tags)
# Uses npm provenance via OIDC — no static NPM_TOKEN required.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for OIDC provenance

jobs:
  publish:
    name: Build, Test & Publish
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Resolve dist-tag from tag name
        id: channel
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          case "$tag" in
            *-canary.*) channel=canary ;;
            *-rc.*)     channel=beta ;;
            *-*)        channel=beta ;;
            *)          channel=latest ;;
          esac
          echo "dist_tag=$channel" >> "$GITHUB_OUTPUT"
          echo "Resolved dist-tag: $channel (from tag $tag)"

      - name: Build dist
        run: npm run build

      - name: Run full test suite
        run: npm run test

      - name: Publish to npm (with provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

  smoke:
    name: Smoke install (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Derive tag version
        id: version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Smoke install @arbiter/cli@${{ steps.version.outputs.version }}
        env:
          ARBITER_VERSION: ${{ steps.version.outputs.version }}
        run: npm install -g "@arbiter/cli@${ARBITER_VERSION}"

      - name: Verify arbiter CLI responds
        run: arbiter --version
