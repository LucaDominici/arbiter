name: KIT Self-Canary

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: kit-self-canary
  cancel-in-progress: false

jobs:
  kit-drift-check:
    name: KIT self-canary dry-run validation
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Run kit dry-run audit
        id: run_audit
        run: node dist/cli.js kit install --experimental.kit --dry-run --report-path /tmp/canary-audit.md

      - name: Validate dry-run audit report
        id: validate_report
        run: |
          if [ ! -s /tmp/canary-audit.md ]; then
            echo "::error::KIT dry-run audit report was not created or is empty."
            exit 1
          fi
          if ! grep -qxF '# SELF-KIT Audit Report' /tmp/canary-audit.md; then
            echo "::error::KIT dry-run audit report is missing the expected heading."
            sed -n '1,40p' /tmp/canary-audit.md
            exit 1
          fi

      - name: File issue on canary failure
        if: failure() && (steps.run_audit.outcome == 'failure' || steps.validate_report.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          REPORT_HEAD=$(sed -n '1,80p' /tmp/canary-audit.md 2>/dev/null || echo "(report unavailable)")
          # FAIL-OPEN-INTENT: label may already exist; creation failure is harmless
          gh label create kit-drift --color 0075ca --description "KIT self-canary failure" 2>/dev/null || true
          EXISTING=$(gh issue list \
            --label kit-drift \
            --state open \
            --limit 1 \
            --json number \
            --repo "$GH_REPO" \
            --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            printf '%s\n' \
              "KIT self-canary failed to generate or validate the ephemeral dry-run audit." \
              "" \
              "Run: ${RUN_URL}" \
              "" \
              '```text' \
              "${REPORT_HEAD}" \
              '```' \
              "" \
              "Reproduce with: \`node dist/cli.js kit install --experimental.kit --dry-run --report-path /tmp/canary-audit.md\`" \
              > /tmp/issue-body.txt
            gh issue create \
              --title "[kit-canary] dry-run audit validation failed (run ${RUN_ID})" \
              --body-file /tmp/issue-body.txt \
              --label kit-drift \
              --repo "$GH_REPO"
          fi
