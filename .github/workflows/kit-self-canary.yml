name: KIT Self-Canary

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: kit-self-canary
  cancel-in-progress: false

jobs:
  kit-drift-check:
    name: KIT self-canary drift check
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Run kit dry-run audit
        run: node dist/cli.js kit install --experimental.kit --dry-run --report-path /tmp/canary-audit.md

      - name: Diff against committed audit
        id: diff-check
        run: |
          if ! diff -u docs/REFERENCE/SELF-KIT-AUDIT.md /tmp/canary-audit.md; then
            echo "::error::SELF-KIT-AUDIT.md has drifted from the committed baseline."
            exit 1
          fi

      - name: File issue on drift
        if: failure() && steps.diff-check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          DIFF_OUTPUT=$(diff docs/REFERENCE/SELF-KIT-AUDIT.md /tmp/canary-audit.md 2>&1 || echo "(diff unavailable)")
          gh label create kit-drift --color 0075ca --description "KIT catalog self-audit drift" 2>/dev/null || true # FAIL-OPEN-INTENT: label may already exist; creation failure is harmless
          EXISTING=$(gh issue list \
            --label kit-drift \
            --state open \
            --limit 1 \
            --json number \
            --repo "$GH_REPO" \
            --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            printf '%s\n' \
              "KIT self-canary detected drift in \`docs/REFERENCE/SELF-KIT-AUDIT.md\`." \
              "" \
              "Run: ${RUN_URL}" \
              "" \
              '```diff' \
              "${DIFF_OUTPUT}" \
              '```' \
              "" \
              "Regenerate with: \`node dist/cli.js kit install --experimental.kit --dry-run --report-path docs/REFERENCE/SELF-KIT-AUDIT.md\`" \
              > /tmp/issue-body.txt
            gh issue create \
              --title "[kit-canary] SELF-KIT-AUDIT.md drift (run ${RUN_ID})" \
              --body-file /tmp/issue-body.txt \
              --label kit-drift \
              --repo "$GH_REPO"
          fi
