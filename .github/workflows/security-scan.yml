name: Security Scan

on:
  push:
    branches: [main, 'task/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # continue-on-error removed (#867 C4) — gitleaks failures must block PR/merge,
      # not silently advisory. .gitleaksignore covers documented false-positives.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
          gitleaks-ignore-path: suppressions/.gitleaksignore

  npm-audit:
    name: Dependency Audit (npm audit)
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit (runtime deps, moderate+)
        run: npm audit --omit=dev --audit-level=moderate
