name: _pr-staleness

# Mark PRs stale after 14 days of inactivity, close after 28 days.
# PRs with the 'no-stale' label are exempt from staleness checks.
# Generated by arbiter (#884).

on:
  schedule:
    - cron: '0 8 * * *'   # daily at 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stale:
    name: Mark and close stale PRs
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      pull-requests: write
    steps:
      - name: Process stale pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          STALE_DAYS=14
          CLOSE_DAYS=28
          # Exported so the child python3 sees them via os.environ (a plain shell
          # var is NOT inherited by the subprocess environment).
          export NOW=$(date +%s)
          export STALE_CUTOFF=$((NOW - STALE_DAYS * 86400))
          export CLOSE_CUTOFF=$((NOW - CLOSE_DAYS * 86400))

          # Write the PR list to a file: a `gh ... | python3 - <<EOF` pipe collides
          # with the heredoc on stdin (the heredoc wins, the JSON is discarded and
          # json.load crashes). Reading from a file keeps stdin free for the program.
          gh pr list --repo "$GH_REPO" --state open --json number,updatedAt,labels --limit 200 > prs.json

          python3 <<'PYEOF'
          import json, subprocess, os, time

          with open('prs.json') as f:
              data = json.load(f)
          repo = os.environ['GH_REPO']
          now = int(os.environ['NOW'])
          stale_cutoff = int(os.environ['STALE_CUTOFF'])
          close_cutoff = int(os.environ['CLOSE_CUTOFF'])

          for pr in data:
              labels = [l['name'] for l in pr['labels']]
              if 'no-stale' in labels:
                  continue

              updated = int(time.mktime(time.strptime(pr['updatedAt'], '%Y-%m-%dT%H:%M:%SZ')))
              pr_num = pr['number']

              if updated < close_cutoff:
                  if 'stale' in labels:
                      subprocess.run(
                          ['gh', 'pr', 'edit', str(pr_num), '--remove-label', 'stale', '--repo', repo],
                          check=False,
                      )
                  subprocess.run(
                      ['gh', 'pr', 'close', str(pr_num), '--repo', repo,
                       '--comment', 'Closing as stale after 28 days of inactivity. Add no-stale label to exempt.'],
                      check=False,
                  )
                  print(f'Closed stale PR #{pr_num}')
              elif updated < stale_cutoff:
                  if 'stale' not in labels:
                      subprocess.run(
                          ['gh', 'label', 'create', 'stale',
                           '--description', 'No activity in 14+ days',
                           '--color', 'ededed',
                           '--repo', repo,
                           '--force'],
                          check=False,
                      )
                      subprocess.run(
                          ['gh', 'pr', 'edit', str(pr_num), '--add-label', 'stale', '--repo', repo],
                          check=False,
                      )
                      print(f'Marked PR #{pr_num} as stale')
          PYEOF
