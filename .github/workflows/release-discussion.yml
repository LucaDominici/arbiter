name: Post release notes to Discussions

on:
  release:
    types: [published]

permissions:
  discussions: write
  contents: read

jobs:
  post-discussion:
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    continue-on-error: true
    steps:
      - name: Post release notes to Discussions Announcements
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const name = process.env.RELEASE_NAME || tag;
            const body = process.env.RELEASE_BODY || '';
            const url = process.env.RELEASE_URL;

            const categories = await github.graphql(`
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  discussionCategories(first: 20) {
                    nodes { id name }
                  }
                }
              }
            `, { owner: context.repo.owner, repo: context.repo.repo });

            const cat = categories.repository.discussionCategories.nodes
              .find(c => c.name === 'Announcements');

            if (!cat) {
              core.warning('No "Announcements" Discussion category found — skipping. Enable Discussions and add an Announcements category to activate this workflow.');
              return;
            }

            const repoData = await github.graphql(`
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) { id }
              }
            `, { owner: context.repo.owner, repo: context.repo.repo });

            const title = `Released: ${name}`;
            const discussionBody = [
              `## ${name}`,
              '',
              body,
              '',
              `---`,
              `Full release notes and assets: ${url}`,
            ].join('\n');

            await github.graphql(`
              mutation($repoId: ID!, $catId: ID!, $title: String!, $body: String!) {
                createDiscussion(input: {
                  repositoryId: $repoId,
                  categoryId: $catId,
                  title: $title,
                  body: $body,
                }) { discussion { url } }
              }
            `, {
              repoId: repoData.repository.id,
              catId: cat.id,
              title,
              body: discussionBody,
            });

            core.info(`Discussion created for ${tag}`);
