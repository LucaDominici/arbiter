name: First-time contributor welcome

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greet:
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Welcome, and thank you for opening your first issue!

            Please make sure your issue includes:
            - A clear description of the problem or request
            - Steps to reproduce (for bugs)
            - Relevant version info (`arbiter --version`)

            A maintainer will triage this within 5 working days (CET timezone).
            See CONTRIBUTING.md for full guidelines.
          pr-message: |
            Thank you for your first pull request!

            A maintainer will review it within 5 working days (CET timezone).

            While you wait:
            - Make sure `node scripts/check-all.mjs L1` passes locally
            - Link any related issue with `Fixes #NNN`
            - Mark as a draft if you still want to iterate

            See CONTRIBUTING.md for the full contribution guide.
