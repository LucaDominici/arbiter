name: Sigstore OCI re-sign (manual dispatch)

# Manual OCI image re-sign for post-outage recovery (H3-S1). Triggered via
# `workflow_dispatch` only — the repository owner re-signs an image ref after
# a Sigstore (Fulcio/Rekor) outage that left a release artifact unsigned.
#
# NOTE (#1663, #1887-G): an earlier `workflow_call` (sign-with-retry) half was
# emitted here as opt-in scaffolding for the live release sign path, but was
# never wired into `05-release.yml` (which signs inline). The dead half was
# removed to stop shipping an unwired scaffold; `05-release.yml`'s cosign-sign
# job continues to sign inline. Re-introduce a reusable retry wrapper here
# only when a caller actually `uses:` it.
#
# Generated by arbiter (#885). CANON-18 compliant.
# INV-76: all third-party action refs are SHA-pinned.

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "OCI image reference to re-sign (e.g. ghcr.io/org/app@sha256:...)"
        required: true
        type: string
      justification:
        description: "Reason for manual re-sign (audit trail — required)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  resign-oci-image:
    name: Re-sign OCI image (manual dispatch, post-outage)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - name: Owner-only guard
        run: |
          if [[ "${{ github.actor }}" != "${{ github.repository_owner }}" ]]; then
            echo "::error::Only the repository owner may trigger manual OCI re-sign"
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sigstore preflight check
        run: |
          STATUS=$(curl -sf https://status.sigstore.dev/api/v2/status.json \
            --max-time 10 | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('status',{}).get('indicator','unknown'))" 2>/dev/null || echo "unknown")
          if [[ "$STATUS" != "none" ]]; then
            echo "::warning::Sigstore status is '${STATUS}' — cosign sign may fail"
          fi
          if [[ "$STATUS" == "major" || "$STATUS" == "critical" ]]; then
            echo "::error::Sigstore is degraded (${STATUS}) — aborting re-sign"
            exit 1
          fi
          echo "sigstore-status=$STATUS"

      - name: Configure Docker credential store (macOS keychain bypass)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/.docker"
          echo '{"credsStore":""}' > "$HOME/.docker/config.json"

      - name: Log in to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: cosign sign OCI image (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes "${{ inputs.image_ref }}"

      - name: cosign verify OCI image
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ inputs.image_ref }}"

      - name: Audit log
        run: |
          {
            echo "## OCI Re-sign Audit Log"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${{ inputs.image_ref }}\` |"
            echo "| Actor | \`${{ github.actor }}\` |"
            echo "| Justification | ${{ inputs.justification }} |"
            echo "| Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo "| Timestamp | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
          } >> "$GITHUB_STEP_SUMMARY"
