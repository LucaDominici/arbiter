name: CLI E2E (#592)

# Cross-OS CLI end-to-end tests: ubuntu-latest, macos-latest, windows-latest.
# All three lanes use github-hosted runners (NOT self-hosted) because
# macOS and Windows runners are not available on our docker-ci-build pool.
#
# Windows lane: runs in bash shell (git bash). WSL2-in-CI is too brittle
# for reliable automation; tracked as a follow-up in #592.
#
# Line-ending strategy: LF everywhere (see .gitattributes).
# Assertion tolerates OS line endings via Node fs read + trim.

on:
  push:
    branches: [main, 'task/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-e2e:
    name: CLI E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        shell: bash
        run: npm ci --legacy-peer-deps

      - name: Build
        shell: bash
        run: npm run build

      - name: Pack tarball
        shell: bash
        run: npm pack

      - name: Install from tarball globally
        shell: bash
        run: |
          TARBALL=$(ls arbiter-cli-*.tgz 2>/dev/null || ls *.tgz 2>/dev/null | head -1)
          npm install -g "$TARBALL"

      - name: Verify arbiter binary
        shell: bash
        run: arbiter --version

      - name: Run arbiter init --yes on fixture dir
        shell: bash
        run: |
          mkdir -p tmp/e2e-fixture
          cd tmp/e2e-fixture
          git init
          git commit --allow-empty -m "init"
          arbiter init --yes --governance-level standard

      - name: Assert generated artifacts exist
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const base = 'tmp/e2e-fixture';
          const expected = JSON.parse(fs.readFileSync('__tests__/fixtures/cli-e2e/expected-files.json', 'utf8'));
          let failed = false;
          for (const rel of expected) {
            const full = path.join(base, rel);
            if (!fs.existsSync(full)) {
              console.error('MISSING: ' + full);
              failed = true;
            } else {
              const content = fs.readFileSync(full, 'utf8').trim();
              if (!content) {
                console.error('EMPTY: ' + full);
                failed = true;
              } else {
                console.log('OK: ' + rel);
              }
            }
          }
          if (failed) process.exit(1);
          console.log('All expected files present and non-empty.');
          "
