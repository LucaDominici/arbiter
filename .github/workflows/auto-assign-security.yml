name: Auto-assign security issues

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  assign-security:
    if: github.event.label.name == 'security'
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - name: Assign maintainer to security issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: ['LucaDominici'],
            });
