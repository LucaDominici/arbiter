name: _ai-draft-check

# INV-91: AI-PR human-approval gate.
# Bot-authored PRs must have the approved-by-human label before merge.
# Triggers on label changes so re-labeling turns the check green immediately.
# Generated by arbiter (#884).

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

# Only the latest label state matters — supersede older in-flight runs per PR.
concurrency:
  group: ai-draft-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-draft-check:
    name: AI-PR human-approval check (INV-91)
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    if: github.event.pull_request.user.type == 'Bot'
    steps:
      - name: Assert approved-by-human label on bot-authored PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            if (!labels.includes('approved-by-human')) {
              core.setFailed(
                'Bot-authored PR requires the "approved-by-human" label before merge. ' +
                'A human reviewer must approve the PR. ' +
                'See docs/REFERENCE/ai-pr-gate.md (INV-91).'
              );
            } else {
              core.info('approved-by-human label present — AI-PR gate passes.');
            }
