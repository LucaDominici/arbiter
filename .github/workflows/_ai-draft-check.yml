name: AI-draft PR check (bot)

# INV-91: AI-PR human-approval gate.
# AI-authored PRs must have the approved-by-human label before merge.
# "AI-authored" is detected from (owner decision, #2552):
#   1. the `ai-authored` label — manual override, forces the gate on even
#      without a detected trailer;
#   2. a commit trailer left by coding-agent tooling on any commit in the PR
#      (Co-Authored-By: Claude/Codex/Copilot/GPT, Claude-Session:,
#      Codex-Session: — case-insensitive) — the primary signal, since an
#      agent adds these automatically regardless of which human token opened
#      the PR;
#   3. github.event.pull_request.user.type == 'Bot' — kept as an additional
#      signal for GitHub-App-authored PRs, which never carry commit trailers.
# `user.type == 'Bot'` alone was the ORIGINAL (and only) signal, and it never
# fires for an agent working through a human's OAuth/PAT token (#2552) — the
# PR author is a User in that case.
# Triggers on label changes so re-labeling turns the check green immediately.
# dependabot[bot] is exempt: dependency-bump PRs are low-risk boilerplate and
# nobody applies the approved-by-human label to them, so the gate was pure
# noise on every dependabot PR.
# Generated by arbiter (#884, #2552).

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

# Only the latest label state matters — supersede older in-flight runs per PR.
concurrency:
  group: ai-draft-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ai-draft-check:
    name: AI-PR human-approval check (INV-91)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    steps:

      - name: Record standing owner approval
        run: |
          echo 'INV-91 amended: trunk-solo — standing owner approval (sole developer)'

