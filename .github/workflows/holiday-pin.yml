name: Maintainer OOO pin

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'OOO start date (YYYY-MM-DD)'
        required: true
        type: string
      end:
        description: 'OOO end date (YYYY-MM-DD)'
        required: true
        type: string

jobs:
  pin-ooo:
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    permissions:
      issues: write
    env:
      OOO_START: ${{ inputs.start }}
      OOO_END: ${{ inputs.end }}
    steps:
      - name: Create OOO issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Maintainer OOO: ${OOO_START}--${OOO_END}"
          BODY="Primary maintainer is OOO from ${OOO_START} to ${OOO_END}. Response times will be slower than usual. PRs and issues will be triaged on return. For urgent security issues see SECURITY.md."

          gh issue create \
            --title "$TITLE" \
            --body "$BODY" \
            --label "maintainer-notice" \
            --repo "$GITHUB_REPOSITORY"
