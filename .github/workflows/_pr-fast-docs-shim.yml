name: _pr-fast-docs-shim

# #1878: 01-pr-fast.yml (the only workflow emitting the required "CI Required"
# context) has `paths-ignore: [docs/**, *.md, .gitignore, .editorconfig]` on
# `pull_request`. A docs-only PR never triggers it, the context is never
# reported, and with `required_status_checks.strict: true` the PR stays
# BLOCKED forever (no merge queue on personal-account private repos to fall
# back on). Standard recipe: a companion workflow with the EXACT inverse path
# filter, running a trivial always-green job named exactly `CI Required`.
# Mixed PRs (docs + code) trigger both workflows; both report the context;
# the real 01-pr-fast gate remains authoritative for any code change.

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review, unlabeled]
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - '.editorconfig'

concurrency:
  group: pr-fast-docs-shim-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci-required:
    name: CI Required
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - run: echo "docs-only change (or docs subset of a mixed PR) — 01-pr-fast.yml's paths-ignore excludes this path set; reporting the required context so the PR can leave BLOCKED. See #1878."
