on:
  workflow_call:
    inputs:
      nvd-cache-namespace:
        description: Cache namespace for NVD data (e.g. nightly, weekly)
        type: string
        required: true

permissions:
  contents: read

jobs:
  dast-full:
    name: OWASP ZAP full scan

    if: false

    continue-on-error: true
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # E4 (#1502): the PR-path dast-baseline (02-pr-extended) consolidated here at
      # nightly cadence. Start the application so the full active scan has a live
      # target — the prior nightly scan pointed at localhost:8080 with nothing running.
      - name: Start application
        run: docker compose up -d --wait
      - name: ZAP full scan
        uses: zaproxy/action-full-scan@d2a07475d467566c9a3e3c700f31f47724aa1060  # v0.10.0
        with:
          target: 'http://localhost:8080'
          fail_action: false
          artifact_name: zap-full-report
      - name: Stop application
        if: always()
        run: docker compose down

  dep-cve-refresh:
    name: Dependency CVE refresh
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-node-pnpm
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: '--lockfile=package-lock.json'

