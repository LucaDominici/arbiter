name: Stale Issues

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues: 60 days idle → stale label + comment; 30 days further idle → close (90d total)
          days-before-issue-stale: 60
          days-before-issue-close: 30
          stale-issue-label: 'stale'
          stale-issue-message: >
            This issue has been idle for 60 days and is now marked as stale.
            If it is still relevant, please leave a comment or remove the `stale` label.
            It will be closed in 30 days unless there is further activity.
          close-issue-message: >
            This issue was closed automatically after 90 days of inactivity.
            Please reopen if this is still relevant.

          # PRs: 45 days idle → stale; 15 days further → close (60d total)
          days-before-pr-stale: 45
          days-before-pr-close: 15
          stale-pr-label: 'stale'
          stale-pr-message: >
            This PR has been idle for 45 days and is now marked as stale.
            Please update it or leave a comment if you are still working on it.
          close-pr-message: >
            This PR was closed automatically after 60 days of inactivity.
            Please reopen if the work is still in progress.

          # Exempt high-priority, security, and structural labels from stale closure
          exempt-issue-labels: >
            security,bug,priority/P0,priority/P1,pinned,epic,tier/1-blocker,tier/2-launch
          exempt-pr-labels: >
            security,priority/P0,priority/P1,pinned

          operations-per-run: 100
