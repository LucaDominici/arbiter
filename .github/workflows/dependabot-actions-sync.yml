name: Sync EJS Action Pins (dependabot auto-fix)

# Triggered when dependabot bumps a github-actions pin.
# Dependabot updates .github/workflows/*.yml but cannot see EJS templates;
# this workflow syncs src/templates/github/workflows/*.yml.ejs to match,
# so the parity test in __tests__/parity/ci-tier-render-parity.test.ts stays green.
#
# Runs only on dependabot/github_actions/* branches — no effect on human PRs.
# Human approval (INV-74) is still required before merge.
#
# Security note: github.head_ref is used only in actions/checkout ref: parameter
# (safe — no shell injection possible) and in an if: expression (not a run: command).

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'

# Supersede older in-flight syncs per PR — only the latest pin set matters.
concurrency:
  group: dependabot-actions-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-action-pins:
    name: Sync EJS Action Pins
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'ubuntu-latest' }}
    if: >
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/github_actions/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Sync EJS action pin versions
        run: node scripts/sync-action-pins.mjs

      - name: Commit sync if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No EJS changes — pins already in sync"
          else
            git add src/templates/github/workflows/
            git commit -m "chore(deps): sync EJS templates with action bumps [skip-docs]"
            git push
          fi
