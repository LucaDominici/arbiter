name: Canary publish

# Publishes a canary build to npm on every push to main (#660 / R1.Q1).
# Canary tag shape: v0.0.0-canary.<short-sha>
# Installable via: `npm i @arbiter/cli@canary`
#
# Stability expectation: HEAD of main. May break at any time. No QA gate
# beyond the standard PR pipeline. Use only for early adopters tracking main.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write # OIDC provenance

concurrency:
  group: canary-publish
  cancel-in-progress: true

jobs:
  canary:
    name: Build & Publish canary
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Compute canary version
        id: version
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          base_version=$(node -p "require('./package.json').version")
          canary="${base_version}-canary.${short_sha}"
          echo "version=$canary" >> "$GITHUB_OUTPUT"
          echo "Canary version: $canary"

      - name: Write canary version into package.json (no commit)
        env:
          CANARY_VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$CANARY_VERSION" --no-git-tag-version --allow-same-version

      - name: Build dist
        run: npm run build

      - name: Run unit tests (canary fast lane)
        run: npm run test

      - name: Publish canary (provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --tag canary
