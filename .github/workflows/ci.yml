name: CI

on:
  push:
    branches: [main, 'task/**']
  pull_request:
    branches: [main]

# Cancel in-progress CI runs on the same ref except for main. Main runs always
# complete so post-merge status does not get truncated; task branches cancel
# stale runs when pushed-over (#357).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  solo-dev-gate:
    name: Solo-Dev Gate (INV-59)
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - run: echo "solo-dev mode — local L2 gate guards merge via INV-59 parity check"

  docs-build:
    name: Docs Build
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run docs:build
