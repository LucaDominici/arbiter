name: CI

on:
  push:
    branches: [main, "task/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  security-early-fail:
    name: Security (Secrets)
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
      - name: Gitleaks secrets scan
        run: |
          gitleaks detect --source . --config .gitleaks.toml \
            --gitleaks-ignore-path suppressions/.gitleaksignore \
            --exit-code 1 --redact

  lint-and-test:
    name: Lint + Typecheck
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    timeout-minutes: 10
    needs: [security-early-fail]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx eslint src __tests__
      - name: Dep audit
        run: npm audit --audit-level=high
      - name: Circular dependency check
        run: npx madge --circular --extensions ts src/
      - name: Placeholder scan
        run: node scripts/check-no-placeholders.mjs src
      - name: Orphan TODO check
        run: node scripts/check-no-orphan-todo.mjs
      - name: Format check
        run: npx prettier --check .
      - name: Inline suppression check
        run: node scripts/check-inline-suppressions.mjs
      - name: Suppressions expiry check
        run: node scripts/check-suppressions.mjs
      - name: Test naming convention check
        run: node scripts/check-test-naming.mjs
      - name: Hardness inventory check
        run: node scripts/check-hardness-inventory.mjs
      - name: Workflow runner label check
        run: node scripts/check-workflow-runners.mjs
      - name: Bloat ratchet (CANON-16, INV-46)
        run: node scripts/check-bloat-ratchet.mjs
      - name: Exit-code contract check (INV-47, #258)
        run: node scripts/check-exit-code-contract.mjs
      - name: Pipe/tee hazard advisory (INV-48, #258)
        run: node scripts/check-pipe-tee-hazard.mjs
      - name: SSOT core set integrity (INV-54, #255)
        run: node scripts/check-ssot-core.mjs
      - name: Doc-links integrity (INV-55, #255)
        run: node scripts/check-doc-links.mjs
      - name: Knowledge-map freshness (INV-56, #255)
        run: node scripts/check-knowledge-map.mjs
      - name: Canonical-paths integrity (INV-57, #255)
        run: node scripts/check-canonical-paths.mjs
      - name: CI/manifest gate alignment check (#240)
        run: node scripts/check-ci-alignment.mjs
      - name: Self-dogfood template check (INV-45, #239)
        run: node scripts/check-self-dogfood.mjs
      - name: Self-validation A/B/C drill (INV-47, #258)
        run: node scripts/self-validation.mjs
      - name: Dead code check
        run: npx knip
      - name: Duplication check (CANON-16, INV-46)
        run: npx jscpd --silent
      - name: Matrix fixture coverage (INV-32)
        run: node scripts/check-matrix-fixtures.mjs
      - name: Matrix proven cells (INV-47)
        run: node scripts/check-matrix-proven-cells.mjs
      - name: Template test ratchet (INV-48)
        run: node scripts/check-template-tests.mjs
      - name: Generator test coverage (INV-49)
        run: node scripts/check-generator-tests.mjs
      - name: Command test coverage (INV-50)
        run: node scripts/check-command-tests.mjs
      - name: Catalog parity (INV-51)
        run: node scripts/check-catalog-agents-parity.mjs
      - name: Enforcement wired (INV-52)
        run: node scripts/check-inv-enforcement-wired.mjs
      - name: Fetch base branch for commitlint
        if: github.event_name == 'pull_request'
        run: git fetch origin main --depth=1
      - name: Commit message lint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from origin/main --to HEAD

  unit-tests:
    name: Unit Tests
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    timeout-minutes: 10
    needs: [lint-and-test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - run: npm run test:unit -- --coverage --reporter=junit --outputFile=test-results/junit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit-${{ github.run_id }}
          path: test-results/
          retention-days: 7

  contract-tests:
    name: Contract Tests
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    timeout-minutes: 10
    needs: [lint-and-test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - run: npm run test:contract

  integration-tests:
    name: Integration Tests
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    timeout-minutes: 10
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - run: npm run test:integration

  behavioral-tests:
    name: Behavioral Tests
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    timeout-minutes: 10
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - run: npm run test:behavioral

  docs-check:
    name: Docs Check
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check docs updated with code changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          HAS_CODE=$(echo "$CHANGED" | grep -E '^(src/|__tests__/)' || true)
          HAS_DOCS=$(echo "$CHANGED" | grep -E '^(docs/|README\.md)' || true)

          if [ -n "$HAS_CODE" ] && [ -z "$HAS_DOCS" ]; then
            echo "::error::Code changed without documentation update"
            echo ""
            echo "Files changed in src/ or __tests__/:"
            echo "$HAS_CODE"
            echo ""
            echo "Please update docs/ or README.md to explain the change."
            exit 1
          fi
          echo "Docs check passed."

  ci-required:
    name: CI Required
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    timeout-minutes: 5
    needs:
      [
        security-early-fail,
        lint-and-test,
        unit-tests,
        contract-tests,
        integration-tests,
        behavioral-tests,
        docs-check,
      ]
    if: always()
    steps:
      - run: |
          if [[ "${{ needs.security-early-fail.result }}" != "success" ]]; then
            echo "security-early-fail failed"
            exit 1
          fi
          if [[ "${{ needs.lint-and-test.result }}" != "success" ]]; then
            echo "lint-and-test failed"
            exit 1
          fi
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "unit-tests failed"
            exit 1
          fi
          if [[ "${{ needs.contract-tests.result }}" != "success" ]]; then
            echo "contract-tests failed"
            exit 1
          fi
          if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
            echo "integration-tests failed"
            exit 1
          fi
          if [[ "${{ needs.behavioral-tests.result }}" != "success" ]]; then
            echo "behavioral-tests failed"
            exit 1
          fi
          if [[ "${{ needs.docs-check.result }}" == "failure" ]]; then
            echo "docs-check failed"
            exit 1
          fi
