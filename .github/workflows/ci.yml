name: CI

on:
  push:
    branches: [main, "task/**"]
  pull_request:
    branches: [main]

jobs:

  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --coverage


  ci-required:
    name: CI Required
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: always()
    steps:
      - run: |
          if [[ "${{ needs.lint-and-test.result }}" != "success" ]]; then
            echo "CI failed"
            exit 1
          fi
