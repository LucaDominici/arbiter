name: Welcome first-time contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Thanks for opening your first issue on arbiter!

            A maintainer will triage this soon. In the meantime, please check our
            [FAQ](docs/FAQ.md) and [Contributing guide](CONTRIBUTING.md).

            If this is a bug, including a minimal reproduction and your `arbiter --version` output helps us move faster.
          pr-message: >
            Thanks for your first pull request!

            A maintainer will review this shortly. Please ensure the gate passes:
            `node scripts/check-all.mjs L1`

            See [CONTRIBUTING.md](CONTRIBUTING.md) for the full workflow.
