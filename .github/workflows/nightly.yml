name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sbom:
    name: SBOM Generation
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm sbom --sbom-format cyclonedx --output-file sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.run_id }}
          path: sbom.json
          retention-days: 90

  security-deep:
    name: Security Deep Scan (Trivy)
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          exit-code: '1'

  publish-evidence-snapshot:
    name: Publish Evidence Snapshot (#653)
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Run evidence snapshot scrubber
        run: node scripts/publish-evidence-snapshot.mjs --input .arbiter/evidence --output docs/case-studies/_evidence-snapshot
      - uses: actions/upload-artifact@v7
        with:
          name: evidence-snapshot-${{ github.run_id }}
          path: docs/case-studies/_evidence-snapshot
          retention-days: 30

  arbiter-self-canary:
    name: Arbiter Self-Canary (#654)
    runs-on: ${{ vars.CI_BUILD_RUNNER_LABEL || 'docker-ci-build' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Run self-canary (dry-run only)
        id: canary
        run: node scripts/run-self-canary.mjs --dry-run
        continue-on-error: true
      - name: Open P0 issue on drift
        if: steps.canary.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh issue create \
            --title "P0: arbiter self-canary detected config drift" \
            --body "The nightly self-canary detected that arbiter init --dry-run would modify files. See workflow run ${RUN_ID} for diff." \
            --label "P0,canary"
      - name: Fail job on drift
        if: steps.canary.outcome == 'failure'
        run: exit 1
