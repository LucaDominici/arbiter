name: Human Approval Gate

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]

# Serialize per PR but never cancel in-flight approval processing — a cancelled run
# could drop an approval-label apply. cancel-in-progress: false is deliberate.
concurrency:
  group: human-approval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  standing-owner-approval:
    name: Standing owner approval (INV-91)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_TEST || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - run: |
          echo 'INV-91 amended: trunk-solo — standing owner approval (sole developer)'

