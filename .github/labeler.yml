# PR auto-labeler — maps touched path globs to label names.
# Kept deliberately narrow to avoid noise.

area/claude:
  - changed-files:
      - any-glob-to-any-file: 'src/templates/claude/**'

area/codex:
  - changed-files:
      - any-glob-to-any-file: 'src/templates/codex/**'

area/gemini:
  - changed-files:
      - any-glob-to-any-file: 'src/templates/gemini/**'

documentation:
  - changed-files:
      - any-glob-to-any-file: 'docs/**'
      - any-glob-to-any-file: '*.md'

ci:
  - changed-files:
      - any-glob-to-any-file: '.github/workflows/**'
      - any-glob-to-any-file: 'scripts/**'
      - any-glob-to-any-file: '.github/**'
