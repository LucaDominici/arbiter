name: Build cache (node-workspace)
description: >-
  Parametric cross-job build cache (strategy: node-workspace). The cache key is
  the immutable workflow run id, so every job in a run shares one build. On `restore`,
  a missing or expired cache entry is NON-BLOCKING: the job rebuilds locally instead of
  failing the run. Strategy is one of node-workspace | python-wheel | maven-reactor |
  gradle, fixed at generation time from the project archetype.
  Uses actions/cache, not upload/download-artifact (#2058): this is pure cross-job
  scratch data for a single run, never downloaded by a human, so it belongs in
  Actions' auto-evicting Cache storage (soft-fail by design) — not the manually-
  retained, hard-quota Artifacts store that a build-cache-shaped payload does
  nothing to deserve.

inputs:
  op:
    description: "Operation: save (build + upload) or restore (download or rebuild)"
    required: true

runs:
  using: composite
  steps:
    # ── restore: fetch under the same run-id key, else rebuild (non-blocking) ──
    - name: Restore cached workspace build (non-blocking)
      id: build-cache-restore
      if: ${{ inputs.op == 'restore' }}
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
      with:
        path: dist
        key: build-cache-node-workspace-${{ github.run_id }}
    - name: Rebuild fallback (cache unavailable)
      if: ${{ inputs.op == 'restore' && steps.build-cache-restore.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        echo "::notice::build-cache unavailable — rebuilding locally (non-blocking fallback)"
        npm run build

    # ── save: build once, cache under the immutable run-id key ──────────────────
    - name: Build (node-workspace)
      if: ${{ inputs.op == 'save' }}
      shell: bash
      run: npm run build
    - name: Save workspace build (run-id keyed)
      if: ${{ inputs.op == 'save' }}
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
      with:
        path: dist
        key: build-cache-node-workspace-${{ github.run_id }}
