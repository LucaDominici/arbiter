name: Sign and Attest Artifact
description: >-
  Keyless cosign sign-blob + CycloneDX SBOM attestation + GitHub native attest-build-provenance.
  Used by release workflow for consistent signing across archetypes (INV-92, #885).
  Generated from: src/templates/github/actions/sign-and-attest/action.yml.ejs (L2 governance)

inputs:
  artifact-name:
    description: GitHub Actions artifact name to download
    required: true
  artifact-path:
    description: Local path to the artifact file to sign
    required: true
  sbom-path:
    description: Path to CycloneDX SBOM file for attestation (optional)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      with:
        name: ${{ inputs.artifact-name }}
    - uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a  # v3.8.1
    - name: Sign artifact (keyless OIDC)
      shell: bash
      run: cosign sign-blob --yes "${{ inputs.artifact-path }}" --bundle "${{ inputs.artifact-path }}.bundle"
    - name: Attest SBOM (cosign attest --predicate, CycloneDX)
      if: ${{ inputs.sbom-path != '' }}
      shell: bash
      env:
        SBOM_FILE: ${{ inputs.sbom-path }}
        ARTIFACT: ${{ inputs.artifact-path }}
      run: |
        cosign attest --yes \
          --predicate "$SBOM_FILE" \
          --type cyclonedx \
          "$ARTIFACT"
    - uses: actions/attest-build-provenance@520aba26e2f010aaab88f4a9c58cdbb3f3965fc2  # v2
      with:
        subject-path: ${{ inputs.artifact-path }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: ${{ inputs.artifact-name }}-signatures
        path: ${{ inputs.artifact-path }}.bundle
        retention-days: 90
