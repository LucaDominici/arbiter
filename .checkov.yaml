# Arbiter self-scan scope (#1685) — consumed by .github/workflows/01-pr-fast.yml
# iac-scan job's checkov step (config_file input). The checkov-action's single
# `framework` input cannot pass a LIST; this config file can (checkov's
# `--framework` is nargs='+'). Scoping the self-scan to the three real IaC
# frameworks arbiter could plausibly carry — arbiter currently has none, so
# this nets 0 findings: honestly SCOPED, not soft_fail-suppressed. The
# SHIPPED consumer template keeps `framework: all` (unaffected by this file);
# this config is repo-local and is NOT part of any shipped template.
framework:
  - terraform
  - kubernetes
  - dockerfile
