# arbiter — Gitleaks configuration
# Generated by arbiter. Managed file — do not delete.
# Docs: https://github.com/gitleaks/gitleaks

[extend]
useDefault = true

[allowlist]
description = "Project-level allowlist (see suppressions/.gitleaksignore)"
paths = [
  '''suppressions/\.gitleaksignore''',
  '''\.gitleaks\.toml''',
  # Test fixture: deliberately planted fake tokens to verify the evidence scrubber runs
  '''__tests__/fixtures/evidence-pii-canary\.txt''',
  # Scanner-test fixtures: deliberately embed the canonical AWS example key
  # (AKIAIOSFODNN7EXAMPLE) to assert the secret-scan family detects it. Allowlisted
  # by path so the project-wide history scan does not re-flag the test's own bait.
  '''__tests__/scripts/gate-fail-closed\.scan-family\.test\.ts''',
  '''__tests__/scripts/publish-evidence-snapshot\.test\.ts''',
  # #1840 F4 tranche 4 (examples/ viventi): `.arbiter-generated-manifest.json` is
  # `arbiter init`'s OWN render-hash manifest (SHA256 per emitted file, #1328) —
  # committed verbatim inside the 3 generated living examples
  # (examples/{ts,python,go}-library/). The default `generic-api-key` rule
  # false-positives on the hex hash values (matches the same
  # `"<key>": "<hex>"` shape as a real key); these are hashes, not secrets.
  '''examples/(ts|python|go)-library/\.arbiter-generated-manifest\.json''',
  # #1908: `__tests__/integration/e2e/bake/__snapshots__/*.json` are vitest
  # golden-master snapshot fixtures asserting byte-for-byte bake output
  # stability (#1328/#1840). Each carries a `contentHashes` map of
  # `"<emitted-file-path>": "<sha256-hex-digest>"`. Same false-positive shape
  # as the manifest allowlist above — the default `generic-api-key` rule
  # misreads the hex digest as a key. These are content hashes of generated
  # test fixtures, never hand-authored, never secrets. Structural fix for the
  # false-positive class (any future golden-master snapshot commit would
  # otherwise retrigger it) — see arbiter#1908.
  '''__tests__/integration/e2e/bake/__snapshots__/.*\.json''',
]

# Paths that gitleaks scans are controlled via .gitleaksignore
# Individual fingerprint suppressions go in suppressions/.gitleaksignore
# (managed by arbiter suppression system with expiry enforcement)

# #2599: exact public wiki digests, not credentials. No positional suppression.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "#2599 immutable wiki run: three verified public SHA256 values only"
condition = "AND"
regexTarget = "secret"
paths = ['''^\.arbiter/evidence/wiki-preview/2599/actual-run-20260909\.json$''']
regexes = ['''^(d95b1656e215e69da19f4c3760d747d559ca2c4f65687da6c5054a387ebeb37d|a2f0ffce1b1f2b0a458a5c5f831a27a6103bcc7fc414c1122dafafa327a9411f|97561b7179fe223418dfda4ba8cfcabff60f724fc1929190b7574a7d7e2c3fa8)$''']
