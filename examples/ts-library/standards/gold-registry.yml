# Gold-Audit registry — the deterministic, code-computed gold engine (#1373, generated by arbiter #1419).
#
# `arbiter gold-audit` grades this repo against the registry → per-check verdict Y/P/N/NA/NV with
# evidence (file [+ line]). The verdict is computed by code, never by an AI: same repo + same
# registry ⇒ byte-identical output. This is the project-level consumer registry; per-stack
# registries (standards/gold-registry.<stack>.yml) add language-specific report-metric checks.
#
# Per check:
#   id          stable identifier (sort key — drives determinism)
#   dimension   grouping (see `dimensions` below)
#   title       human-readable description
#   type        file_exists | file_contains | count_matches | value | manual
#   args        { path, pattern?, equals?, min? } — path is resolved INSIDE the repo root
#   weight      relative contribution to the score (default 1)
#   risk        SAFE | RISKY — a RISKY check fails the false-gap meta-gate (--strict).
#   anchor      optional INV-NN id the check enforces (evidence hint, not an import)
#   applies_if  conditional gating; absent ⇒ always applies. Two forms:
#                 • a string  → an overlay/capability name (NA when that overlay is disabled)
#                 • an object → a generic precondition (G1). UNMET ⇒ NA (excluded from the score);
#                   MET ⇒ the check is evaluated. FAIL-SAFE: an unknown/missing/malformed
#                   precondition ⇒ the check APPLIES (a silent skip would be a false-green). Shapes:
#                     { type: file_exists,   path: go.mod }
#                     { type: file_contains, path: package.json, pattern: '"react"' }
#                     { type: count_matches, path: svc.yml, pattern: 'service:', min: 2 }
#                     { type: capability,    name: regulated }   # object form of the string overlay
#
# Verdicts: Y verified-true · P partial · N verified-false · NA not-applicable · NV manual.
# Scoring excludes NA + NV from the denominator (you are not graded on what code can't verify).
#
# Tune this registry to your project. The no-regress gate (`gold-audit --check`, wired advisory in
# scripts/check-all.mjs) bootstraps a baseline on first run and then only fails on a SCORE DROP.
version: '1.0.0'
profile: tooling

dimensions:
  - id: D-DOCS
    title: Documentation governance
  - id: D-EFFECTIVENESS
    title: Quality tooling wired (anti-ceremony — gate present, not just aspirational)
  - id: D-ENFORCEMENT
    title: Enforcement base (invariants + exit-code contract)

checks:
  # ---- D-DOCS: canonical doc-set presence (anchors the doc-set gate, #1374) ----
  - id: GA-DOC-01
    dimension: D-DOCS
    title: README present
    type: file_exists
    args: { path: README.md }
    weight: 1
    risk: SAFE
  - id: GA-DOC-02
    dimension: D-DOCS
    title: Governance SSOT present (AGENTS.md)
    type: file_exists
    args: { path: AGENTS.md }
    weight: 1
    risk: SAFE
  - id: GA-DOC-03
    dimension: D-DOCS
    title: Security policy present
    type: file_exists
    args: { path: SECURITY.md }
    weight: 1
    risk: SAFE
  - id: GA-DOC-04
    dimension: D-DOCS
    title: Change history present
    type: file_exists
    args: { path: CHANGELOG.md }
    weight: 1
    risk: SAFE
  - id: GA-DOC-05
    dimension: D-DOCS
    # version_consistency: the declared version must equal the newest version recorded in the
    # CHANGELOG. Y = match · P = present but divergent/indeterminate (never a false Y) · N = a
    # required file is missing. version_select reads a dotted JSON path so it audits package.json
    # directly (no separate VERSION file required).
    title: Declared version matches the latest CHANGELOG entry (release hygiene)
    type: version_consistency
    args:
      version_file: package.json
      version_select: version
      changelog_file: CHANGELOG.md
      changelog_pattern: '^##\s*\[?(\d+\.\d+\.\d+)'
    weight: 1
    risk: SAFE

  # ---- D-EFFECTIVENESS: prove the quality gate is WIRED, not just present ----
  - id: GA-EFF-01
    dimension: D-EFFECTIVENESS
    title: Quality gate entrypoint is wired
    type: file_exists
    args: { path: scripts/check-all.mjs }
    weight: 1
    risk: SAFE
  - id: GA-EFF-02
    dimension: D-EFFECTIVENESS
    title: Test suite invocation declared (not aspirational)
    type: file_contains
    args: { path: package.json, pattern: '"test"' }
    weight: 1
    risk: SAFE
    anchor: INV-25

  # ---- D-ENFORCEMENT: governance enforcement base ----
  - id: GA-ENF-01
    dimension: D-ENFORCEMENT
    title: Exit-code contract enforced across scripts
    type: file_exists
    args: { path: scripts/check-exit-code-contract.mjs }
    weight: 1
    risk: SAFE
  - id: GA-ENF-02
    dimension: D-ENFORCEMENT
    title: Supply-chain attestation is human-verified on each release
    type: manual
    weight: 1
    risk: SAFE
