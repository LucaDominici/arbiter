name: Bug Report
description: Report a defect or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before filing:** Check open issues for duplicates.

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Critical — data loss, security breach, or service down"
        - "High — major feature broken, no workaround"
        - "Medium — feature degraded, workaround exists"
        - "Low — cosmetic or minor inconvenience"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "1. Context"
      description: Environment and relevant state when the bug was observed.
      placeholder: |
        **Environment:** Local / CI / Staging / Production
        **Version / commit:** abc1234
        **Pre-conditions:** What state was the system in?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "2. Steps to Reproduce / Observed vs Expected"
      placeholder: |
        **Steps:**
        1.
        2.
        3.

        **Expected:** What should have happened
        **Actual:** What actually happened
    validations:
      required: true

  - type: textarea
    id: invariant
    attributes:
      label: "3. Related Invariant Violation (optional)"
      description: If this bug violates a known project invariant, reference it here.
      placeholder: |
        Violates INV-XX: description

  - type: textarea
    id: evidence
    attributes:
      label: "4. Evidence (optional)"
      description: Logs, screenshots, stack traces, or links to artifacts.
      placeholder: |
        <paste stack trace or attach screenshot>

  - type: checkboxes
    id: acceptance
    attributes:
      label: "5. Acceptance Criteria"
      options:
        - label: "Bug is no longer reproducible following the steps above"
        - label: "Regression test added to prevent recurrence"
        - label: "CI pipeline passes green"
