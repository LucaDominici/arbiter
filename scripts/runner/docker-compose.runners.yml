# Explicit project name: the default would be "runner" (directory basename),
# which COLLIDES with a sibling repo's runner farm project on the same docker-ci
# daemon — compose would adopt/replace that farm's runner-build container.
name: arbiter-runner-farm

services:
  runner-build:
    image: myoung34/github-runner:latest
    restart: unless-stopped
    hostname: arbiter-slot-build
    # .env holds non-secret config only. The registration credential is a
    # short-lived RUNNER_TOKEN minted by farm.sh via the GitHub API
    # (POST /repos/{owner}/{repo}/actions/runners/registration-token) and
    # injected at `compose up` time — no long-lived token on disk (pattern:
    # sibling-repo runner farm).
    env_file:
      - .env
    environment:
      RUNNER_SCOPE: repo
      REPO_URL: ${REPO_URL}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_NAME: arbiter-slot-build
      RANDOM_RUNNER_SUFFIX: "false"
      LABELS: ${LABELS:-self-hosted,linux,x64,docker-ci-build}
      RUNNER_WORKDIR: /tmp/runner/work
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner-state
      DISABLE_AUTO_UPDATE: ${DISABLE_AUTO_UPDATE:-true}
      DISABLE_AUTOMATIC_DEREGISTRATION: ${DISABLE_AUTOMATIC_DEREGISTRATION:-true}
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKERD_IN_RUNNER: "false"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    network_mode: host
    volumes:
      - /var/run/docker-ci/docker.sock:/var/run/docker.sock
      - /var/run/docker-ci/docker.sock:/var/run/docker-ci/docker.sock
      - build-work:/tmp/runner/work
      - build-state:/runner-state
      - build-npm-cache:/root/.npm
      - ${HOME}/.cache/ms-playwright:/root/.cache/ms-playwright

